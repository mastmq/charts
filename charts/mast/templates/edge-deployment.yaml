{{- if eq .Values.mode "cluster" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mast.edge.fullname" . }}
  {{- with .Values.workloadAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "mast.labels" . | nindent 4 }}
    app.kubernetes.io/component: edge
spec:
  {{- if not .Values.edge.autoscaling.enabled }}
  replicas: {{ .Values.edge.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mast.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: edge
  strategy:
    rollingUpdate:
      # Replacing an edge pod reconnects every device on it. Roll one at a
      # time and let the fleet settle between steps.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/edge-configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "mast.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: edge
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "mast.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Long enough for connected devices to be handed over rather than cut.
      terminationGracePeriodSeconds: 90
      containers:
        - name: mast
          image: {{ include "mast.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/mast/mast.toml"]
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with include "mast.envFrom" . }}
          envFrom:
            {{- . | trim | nindent 12 }}
          {{- end }}
          env:
            {{- include "mast.env" . | nindent 12 }}
          ports:
            - name: mqtt
              containerPort: 1883
            {{- if gt (int .Values.edge.internalPort) 0 }}
            - name: mqtt-internal
              containerPort: {{ .Values.edge.internalPort }}
            {{- end }}
            {{- if gt (int .Values.edge.wsPort) 0 }}
            - name: mqtt-ws
              containerPort: {{ .Values.edge.wsPort }}
            {{- end }}
            - name: monitor
              containerPort: 8222
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
          # Readiness is mast's /readyz, which on an edge is the leaf link
          # to the core. A TCP check on the MQTT port passed while that link
          # was down, so the Service kept handing devices to an edge that
          # could carry nothing across the cluster. It is on the metrics port
          # because mast's own server answers it; the NATS monitor has no
          # /readyz. Liveness stays on /healthz: a dead core is not fixed by
          # restarting every edge, and a liveness check on the leaf link
          # would do exactly that.
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.edge.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/mast
              readOnly: true
            {{- with (include "mast.secretMounts" . | trim) }}{{ . | nindent 12 }}{{ end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "mast.edge.fullname" . }}
        {{- with (include "mast.secretVolumes" . | trim) }}{{ . | nindent 8 }}{{ end }}
      {{- with .Values.edge.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.edge.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.edge.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
