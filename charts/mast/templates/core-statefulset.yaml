{{- if eq .Values.mode "cluster" }}
{{- if gt (int .Values.core.jetstreamReplicas) (int .Values.core.replicas) }}
{{- fail (printf "core.jetstreamReplicas (%d) exceeds core.replicas (%d): the KV buckets cannot be created at that replication factor" (int .Values.core.jetstreamReplicas) (int .Values.core.replicas)) }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mast.core.fullname" . }}
  {{- with .Values.workloadAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "mast.labels" . | nindent 4 }}
    app.kubernetes.io/component: core
spec:
  # A StatefulSet because JetStream's Raft peers must keep stable identities
  # and their volumes across a reschedule.
  serviceName: {{ include "mast.core.fullname" . }}
  replicas: {{ .Values.core.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "mast.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: core
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/core-configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "mast.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: core
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "mast.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Raft wants a clean handover, not a kill.
      terminationGracePeriodSeconds: 60
      containers:
        - name: mast
          image: {{ include "mast.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/mast/mast.toml"]
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- include "mast.env" . | nindent 12 }}
          ports:
            - name: cluster
              containerPort: 6222
            - name: leaf
              containerPort: 7422
            - name: nats
              containerPort: 4222
            - name: monitor
              containerPort: 8222
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
          # Liveness and readiness ask different questions on purpose. A bare
          # /healthz also checks JetStream, which is unhealthy exactly while a
          # peer is catching up or the meta group has lost quorum; used for
          # liveness, it has the kubelet kill the peers that are trying to
          # recover, which keeps quorum lost. js-server-only asks only whether
          # the server accepts connections, which is what a restart can fix.
          #
          # The monitor port comes up before JetStream has restored its
          # streams, and the client listener only after, so on a large store
          # even js-server-only fails for a while at boot. The startup probe
          # is that grace, and it is generous because the alternative is a
          # restart loop that never finishes a restore.
          startupProbe:
            httpGet:
              path: /healthz?js-server-only=true
              port: monitor
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz?js-server-only=true
              port: monitor
            periodSeconds: 20
            failureThreshold: 3
          # Readiness keeps the full check. The headless Service publishes
          # not-ready addresses, so this gates rollouts and the PDB rather
          # than peer discovery.
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitor
            periodSeconds: 10
          resources:
            {{- toYaml .Values.core.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/mast
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: {{ include "mast.core.fullname" . }}
        {{- if not .Values.core.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- with .Values.core.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.core.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.core.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.core.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.core.persistence.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.core.persistence.size }}
  {{- end }}
{{- end }}
