{{- if and .Values.admin.enabled (not .Values.admin.existingSecret) .Values.admin.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mast.adminSecretName" . }}
  labels:
    {{- include "mast.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Mounted as a file rather than passed as an environment variable: mast
  # reads the admin token only from admin.token_file, so it shows up in
  # neither the ConfigMap nor a process listing.
  {{ .Values.admin.secretKey }}: {{ .Values.admin.token | quote }}
{{- end }}
