{{- if and (eq .Values.auth.mode "http") (not .Values.auth.http.existingSecret) .Values.auth.http.headers }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mast.fullname" . }}-auth
  labels:
    {{- include "mast.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Headers reach the process as environment variables rather than through
  # the ConfigMap, so a bearer token never sits in plain configuration.
  {{- range $name, $value := .Values.auth.http.headers }}
  MAST__AUTH__HTTP__HEADERS__{{ $name | upper | replace "-" "_" }}: {{ $value | quote }}
  {{- end }}
{{- end }}
