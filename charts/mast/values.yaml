---
# mast deploys in one of two shapes.
#
# standalone runs a single all-in-one process: one pod, file-backed
# JetStream, no cluster. It is the right answer for an edge site, a lab, or
# anything small enough not to need two tiers.
#
# cluster splits the two jobs that have opposite operational shapes. The core
# tier holds Raft and the KV buckets, so it wants stable peers and volumes and
# is a StatefulSet. The edge tier terminates MQTT, scales with connection
# count and restarts on every deploy, so it is a stateless Deployment that
# joins the core as NATS leaf nodes. Coupling them would turn every autoscale
# event into Raft membership churn.
mode: cluster

image:
  repository: ghcr.io/mastmq/mast
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Extra environment for every mast container.
#
# On OpenShift you almost certainly want GODEBUG=multipathtcp=0. Go enables
# multipath TCP on listeners by default from 1.24, and the OpenShift
# dataplane does not handle it: connections are accepted and then every read
# fails with "permission denied", which looks like a broker fault and is not.
extraEnv: []
#  - name: GODEBUG
#    value: multipathtcp=0

log:
  level: info
  # json in a cluster; the text handler is for a terminal.
  format: json

# Applies to standalone and to the core tier.
core:
  replicas: 3
  # Replication factor for the KV buckets. Must not exceed core.replicas,
  # and the chart refuses to render if it does. Use 3 for anything you care
  # about.
  jetstreamReplicas: 3
  # A node drain that takes two of three core peers at once loses Raft
  # quorum, and every KV write stalls until they come back. One at a time
  # keeps a majority through any voluntary disruption.
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}

edge:
  replicas: 2
  # The client-facing Service: MQTT and, when enabled, WebSocket. The
  # internal listener, metrics and the NATS monitor are on a separate
  # <name>-internal Service that is always ClusterIP, so setting type here
  # to LoadBalancer publishes only what devices are meant to reach.
  service:
    type: ClusterIP
    mqttPort: 1883
    annotations: {}

  # A second listener that skips authentication and authorization, for
  # trusted in-cluster services. Zero disables it. Whatever reaches it is
  # trusted completely, so it is served only on the ClusterIP <name>-internal
  # Service. Still pair it with a NetworkPolicy: ClusterIP keeps it off the
  # internet, not away from every pod in the cluster.
  internalPort: 0

  # MQTT over WebSocket, for browsers and anything behind an HTTP ingress.
  # Zero disables it. Authentication applies here exactly as it does on the
  # plain listener.
  wsPort: 0
  # Budget memory as roughly 40-80KB per TLS connection plus headroom, and
  # remember that maxWritesPending multiplies by connections per pod, not by
  # the whole fleet.
  maxWritesPending: 1024
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
  # A deploy that cycles every edge pod at once reconnects the whole fleet at
  # once. Keep this tight.
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 2Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# TLS on the MQTT listener (and the WebSocket one, when enabled). Name a
# Secret of type kubernetes.io/tls, such as cert-manager writes; it is
# mounted into every pod that terminates MQTT, and the listener then speaks
# only TLS on the same port. Empty serves plain MQTT. The internal listener
# never uses TLS: it is meant for in-cluster peers that are trusted anyway.
tls:
  secretName: ""

auth:
  # static: one tenant, everything allowed. Only appropriate where the
  #         deployment itself is the security boundary.
  # http:   ask your own service, posting the MQTT fields as JSON.
  # jwt:    verify a signed token locally, so a reconnect storm touches no
  #         service; revocation is only as fast as token expiry. Set
  #         auth.http.authzUrl as well to keep topic decisions on a policy
  #         service, since a signature says who a client is, not what it
  #         may do.
  mode: static

  # Used in static mode.
  tenantDefault: default

  http:
    # Request and response shape.
    #   mast: the service names the tenant, which is what multi-tenancy needs.
    #   emqx: EMQX v5's http backend shape, so an auth service written for
    #         EMQX works unchanged. EMQX has no tenant field, so
    #         auth.tenantDefault applies.
    wire: mast

    # Posted on CONNECT; must return {"allow":true,"tenant":"..."}, or
    # {"result":"allow"} under the emqx wire.
    authnUrl: ""
    # Posted per publish and subscribe; must return {"allow":true}.
    # Empty means an authenticated connection may use any topic inside its
    # own tenant.
    authzUrl: ""
    timeout: 2s
    # Authorization behaviour when the service is unreachable: deny makes an
    # outage look like a broker outage, allow makes it look like an open
    # door. Authentication always fails closed regardless of this setting.
    onError: deny
    # Authorization is asked on every publish, so 0s costs a round trip per
    # message.
    cacheTtl: 1m
    cacheSize: 100000
    # Headers sent with every auth request. Rendered into a Secret.
    headers: {}
    #  Authorization: "Bearer ..."
    # Or point at a Secret you manage yourself. It is loaded with envFrom,
    # so its keys are environment variable names, not header names: the
    # header name upper-cased, hyphens as underscores, behind
    # MAST__AUTH__HTTP__HEADERS__. Authorization becomes
    # MAST__AUTH__HTTP__HEADERS__AUTHORIZATION and X-Api-Key becomes
    # MAST__AUTH__HTTP__HEADERS__X_API_KEY. A key without the prefix is
    # silently ignored.
    existingSecret: ""

  jwt:
    # The CONNECT field carrying the token. username, because many clients
    # log passwords and none log usernames.
    source: username
    # Discard everything up to the first colon, for "<vendor>:<token>".
    vendorPrefix: false
    # Required in jwt mode, with deliberately no default: accepting whatever
    # algorithm a token asks for is how "alg":"none" and RSA-to-HMAC
    # confusion attacks work. The chart refuses to render without it.
    algorithms: []
    # The verification key comes from a Secret you manage, never from
    # values, so it cannot end up in a values file in git. Name the Secret
    # and the one key in it that holds either an HMAC secret or a PEM
    # public key; setting both, or neither, fails the render.
    keySecret: ""
    hmacSecretKey: ""
    publicKeyKey: ""
    # The claim naming the tenant. Empty, or a token without it, falls back
    # to auth.tenantDefault.
    tenantClaim: ""
    # A boolean claim that bypasses authorization, as EMQX's is_superuser
    # does.
    superuserClaim: ""
    # An object claim that overrides the tenant's limits, with the keys of
    # a [limits.tenants.<id>] entry in mast's own spelling:
    # {"max_connections":500,"publish_rate":50}. The newest token's claim
    # wins, by iat. Empty reads no limits from tokens.
    limitsClaim: ""
    # Checked against the token when set.
    issuer: ""
    audience: ""

# How messages cross between nodes. QoS 1 and 2 are stored on one replicated
# JetStream stream before they are acknowledged, and every node reads it
# through one consumer of its own, so a node cut off from the core for a
# moment catches up instead of losing what was published for its clients.
# QoS 0 never touches it. Turning durableQoS off makes cross-node QoS 1 and 2
# at-most-once again; it exists for rollouts and measurement.
fabric:
  durableQoS: true
  # How long the stream keeps a message: how long a node can be cut off
  # and still catch up.
  durableMaxAge: 5m

# OpenTelemetry traces of the message path, exported over OTLP/HTTP. Off by
# default because off costs the broker nothing, and on is a per-message cost
# and a collector to run. Only edges and the standalone pod trace: a core
# has no MQTT side and builds no tracer. The [tracing] block is rendered
# only when this is on, so turning the chart over to a version with it does
# not change the ConfigMap and roll every edge, which reconnects the fleet.
# Needs a mast that reads [tracing] (after v0.3.2); an older one ignores it.
tracing:
  enabled: false
  # The collector, e.g. http://otel-collector.monitoring:4318. Empty defers
  # to OTEL_EXPORTER_OTLP_TRACES_ENDPOINT or OTEL_EXPORTER_OTLP_ENDPOINT
  # from existingSecret or extraEnv, then http://localhost:4318.
  endpoint: ""
  # An OTEL_TRACES_SAMPLER name. parentbased_traceidratio with a small
  # samplerArg is the one for a fleet: one decision per message at its
  # ingress, followed by every node that delivers it. Empty defers to
  # OTEL_TRACES_SAMPLER, then parentbased_always_on, which traces every
  # message. A client's sampled flag never overrides it.
  sampler: ""
  # The ratio, as a string because OTEL_TRACES_SAMPLER_ARG is one, e.g.
  # "0.01". Empty defers to OTEL_TRACES_SAMPLER_ARG, then 1.
  samplerArg: ""
  # A Secret you manage whose keys are OTEL_* variables, loaded into the
  # edge and standalone containers. It exists for
  # OTEL_EXPORTER_OTLP_HEADERS: a collector's API key belongs in a Secret,
  # never in values or the ConfigMap.
  existingSecret: ""

# The admin HTTP API: list a tenant's sessions, read one, disconnect a
# client, and a tenant's counts, for the whole cluster from any pod. Off by
# default because it can disconnect devices. On every role, a core included,
# on its own port, published only on the internal Services and never on the
# public one, and with no Ingress: reach it with kubectl port-forward or from
# inside the cluster. Rendered only when on, so an upgrade with it off rolls
# nothing. Needs a mast that reads [admin] (after v0.3.2); an older one
# ignores the block and serves nothing.
admin:
  enabled: false
  # Its own listener, apart from metrics.port, because anything that can
  # scrape the metrics port could otherwise disconnect devices.
  port: 9091
  # How long a list or stats request waits for every pod to answer. Every
  # such request waits this long, and a pod slower than it is missing from
  # the answer, which says how many answered. mast refuses more than 5s.
  gather: 500ms
  # The bearer token comes from a Secret, mounted as a file and read once at
  # startup; mast has no setting for the token itself, so it never lands in
  # the ConfigMap or the environment. Name a Secret you manage here, holding
  # the token under secretKey. Changing the token takes a pod restart.
  existingSecret: ""
  secretKey: token
  # Or have the chart create that Secret from this value, at least 16
  # bytes. Prefer existingSecret: a value here sits in the release's stored
  # values and in whatever file you passed with -f.
  token: ""

session:
  # How long a disconnected persistent session and its queued QoS 1/2
  # messages are kept, counted from DISCONNECT.
  expiry: 24h

# Per-tenant limits. The defaults here are mast's own, and the [limits] block
# is rendered only when one of them changes, so an upgrade that leaves them
# alone does not change the ConfigMaps and roll every edge. Cores and edges
# render the same block: only a core sets how many messages the offline
# stream keeps per session, and it sizes that from the largest
# offlineQueue here or under tenants. Needs a mast that reads [limits]
# (after v0.3.2); an older one ignores it.
limits:
  # A tenant's open connections across the whole cluster; 0 is unlimited.
  # Pods exchange counts every syncInterval over core NATS rather than
  # writing a counter on every CONNECT, so a burst spread over several edges
  # can overshoot it by what they accept within one interval. Refused with
  # CONNACK 0x97 Quota exceeded on MQTT 5, 0x03 Server unavailable on 3.1.1.
  maxConnections: 0
  # PUBLISH packets per second per tenant, enforced on each pod separately,
  # so an HPA that adds edges raises what a tenant can send through them all;
  # 0 is unlimited. Over it, QoS 0 is dropped, MQTT 5 QoS 1 gets PUBACK 0x96,
  # and MQTT 5 QoS 2 and MQTT 3.1.1 QoS 1/2 are disconnected.
  publishRate: 0
  # Publishes that may arrive at once before the rate applies; 0 is one
  # second's worth.
  publishBurst: 0
  # QoS 1/2 messages kept for one absent session, newest first. It also
  # bounds what a device coming back to the pod it left is resent, which
  # before limits was everything mochi held for it.
  offlineQueue: 100
  syncInterval: 2s
  # Overrides for named tenants, field by field; a field left out keeps the
  # default above. A tenant id must be letters, digits, - and _ to be named
  # here. The authentication backend can override these per tenant too (a
  # "limits" object in an HTTP reply, or auth.jwt.limitsClaim).
  tenants: {}
  #  acme:
  #    maxConnections: 5000
  #    publishRate: 200
  #    offlineQueue: 500

# Restricts who can reach the pods. Off by default because a policy that
# selects a pod turns every port not listed into denied, and the right peers
# are cluster-specific. Note that Kubernetes policies only ever add allowed
# traffic: in a namespace that already allows everything from everywhere
# (OpenShift projects often carry an allow-from-all-namespaces policy), this
# restricts nothing, and the internal listener stays reachable.
networkPolicy:
  enabled: false
  # Peers besides pods in the release's own namespace that may reach the
  # unauthenticated internal listener, metrics and the NATS monitor, as
  # NetworkPolicyPeer objects — typically the monitoring namespace.
  internalFrom: []

metrics:
  # Publishes the metrics port on the internal Service, and with it what the
  # ServiceMonitor, the dashboard and the alerts read. The pod serves the
  # port either way: it is mast's own server, which also answers /readyz for
  # the readiness probe and /debug/pprof.
  enabled: true
  port: 9090
  # How many tenants get a label of their own on each pod's per-tenant
  # metrics; the rest are counted together as tenant="~other". 0 is
  # unbounded, which is fine for a handful of tenants and a Prometheus outage
  # for ten thousand.
  maxTenantLabels: 1000
  # Requires the Prometheus operator CRDs.
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
  # A Grafana dashboard in a ConfigMap, for the Grafana sidecar that loads
  # every ConfigMap carrying its label (kube-prometheus-stack runs one). Off
  # by default because without that sidecar it is a ConfigMap nobody reads.
  # Its queries filter on the namespace and pod labels that a ServiceMonitor
  # scrape adds.
  grafanaDashboard:
    enabled: false
    # The sidecar's label. grafana_dashboard: "1" is its default.
    labels:
      grafana_dashboard: "1"
    # grafana_folder here puts it in a folder, if the sidecar is set to
    # read folders from an annotation.
    annotations: {}
  # Alerts for the Prometheus operator. Off by default because it needs the
  # PrometheusRule CRD. The mast rules read what the ServiceMonitor scrapes;
  # the readiness rules read kube-state-metrics, which is the only place a
  # pod that is not serving, rather than a number that went wrong, shows up.
  prometheusRule:
    enabled: false
    # Labels your Prometheus selects rules by, e.g. release: <stack>.
    labels: {}
    # How many sessions the queuer may keep for absent clients before it is
    # worth a look. They are devices that went away with a persistent
    # session and have not come back, so the right number is a fraction of
    # your fleet; 0 turns the alert off.
    queuerAwaySessionsThreshold: 0

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Annotations on the workload itself (StatefulSet or Deployment), as
# distinct from podAnnotations which land on the pod template.
#
# The case this exists for: replacing another broker under the same name.
# A StatefulSet's selector is immutable, so a tool that patches in place
# fails with "updates to statefulset spec ... are forbidden" and the
# migration stops halfway. Under Argo CD, setting
# argocd.argoproj.io/sync-options: Replace=true here lets the sync delete
# and recreate it instead.
workloadAnnotations: {}

podAnnotations: {}
podLabels: {}

# On OpenShift the restricted SCC assigns a uid from the namespace range and
# rejects a pod that asks for its own, so null these out and let the platform
# choose. Setting them to {} is not enough: Helm deep-merges maps, so only an
# explicit null removes a default.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
