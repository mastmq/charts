---
name: release

on:
  push:
    tags: ["mast-*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          # Same Helm the lint workflow validates with. Packaging with 3.x
          # while the chart is linted and authored against 4.x is the exact
          # mismatch lint.yaml warns about, and here it would ship.
          version: v4.3.0

      - name: log in to ghcr
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: package and push
        run: |
          helm package charts/mast -d dist
          helm push dist/mast-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
